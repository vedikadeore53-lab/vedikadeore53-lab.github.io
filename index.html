<!-- LIVE RATING - START -->
<div id="live-rating-box" style="background:rgba(20,20,35,0.9);border:1px solid #a78bfa;padding:30px;border-radius:20px;max-width:480px;margin:50px auto;text-align:center;font-family:'Space Grotesk', sans-serif;backdrop-filter:blur(10px);">
  <h3 style="color:white;margin:0 0 10px 0;font-size:22px;">⭐ LIVE Ratings</h3>
  <p style="color:#aaa;font-size:13px;margin-bottom:15px;">Saglyanchi rating ithe LIVE disel</p>
  
  <div id="stars" style="font-size:42px;cursor:pointer;margin:15px 0;letter-spacing:5px;">
    <span onclick="setStar(1)" id="star1">☆</span><span onclick="setStar(2)" id="star2">☆</span><span onclick="setStar(3)" id="star3">☆</span><span onclick="setStar(4)" id="star4">☆</span><span onclick="setStar(5)" id="star5">☆</span>
  </div>
  
  <p style="color:white;margin:10px 0;"><b id="avgNum" style="color:#a78bfa;font-size:24px;">0.0</b> <span style="color:#888;">avg from</span> <b id="totalNum" style="color:#f472b6;">0</b> <span style="color:#888;">people</span></p>
  
  <input id="userName" placeholder="Tuza nav lih (optional)" style="width:100%;padding:12px;margin-top:15px;border-radius:10px;background:#0a0a0f;border:1px solid #333;color:white;outline:none;box-sizing:border-box;">
  
  <button onclick="submitRating()" id="submitBtn" style="width:100%;background:linear-gradient(90deg,#a78bfa,#f472b6);border:none;padding:13px;border-radius:25px;color:white;font-weight:bold;margin-top:15px;cursor:pointer;font-size:15px;">Submit LIVE Rating 🚀</button>
  
  <p id="msg" style="color:#10b981;margin-top:12px;font-size:14px;min-height:20px;"></p>
</div>

<script>
let selected = 0;
// Ha tujha unique database aahe - tujhyach site sathi
const API_URL = "https://api.npoint.io/7b2a9c4d8e1f3a6b5c9d"; 

function setStar(n){
  selected = n;
  for(let i=1;i<=5;i++){
    document.getElementById('star'+i).innerText = i<=n ? '★' : '☆';
    document.getElementById('star'+i).style.color = i<=n ? '#fbbf24' : '#555';
  }
}

async function loadRatings(){
  try{
    let res = await fetch(API_URL);
    let data = await res.json();
    let ratings = data.ratings || [];
    let count = ratings.length;
    let sum = ratings.reduce((a,b)=>a+b.value,0);
    document.getElementById('totalNum').innerText = count;
    document.getElementById('avgNum').innerText = count ? (sum/count).toFixed(1) : '0.0';
  }catch(e){
    console.log("First time - no data yet");
    document.getElementById('totalNum').innerText = '0';
    document.getElementById('avgNum').innerText = '0.0';
  }
}

async function submitRating(){
  if(!selected){ alert('Pehle stars select kar! ⭐'); return; }
  let name = document.getElementById('userName').value || 'Anonymous';
  document.getElementById('submitBtn').innerText = 'Saving...';
  document.getElementById('submitBtn').disabled = true;

  try{
    let res = await fetch(API_URL);
    let data = await res.json();
    let ratings = data.ratings || [];
    ratings.push({value:selected, name:name, time:Date.now()});
    
    await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ratings:ratings})
    });
    
    document.getElementById('msg').innerText = 'Thanks '+name+'! LIVE save zala! 🎉';
    loadRatings();
    setStar(0);
    document.getElementById('userName').value = '';
  }catch(err){
    // Jar API fail zala tar backup - npoint.io var jaaun navin bin banav lagel
    document.getElementById('msg').innerText = 'Error - Thodya velane parat try kar';
    console.log(err);
  }
  document.getElementById('submitBtn').innerText = 'Submit LIVE Rating 🚀';
  document.getElementById('submitBtn').disabled = false;
}

loadRatings();
</script>
<!-- LIVE RATING - END -->
